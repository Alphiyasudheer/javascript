<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        
        const num=parseInt(prompt('Enter a number'))
        let isPrime=true;
        if(num==1){
            console.log('it is not prime or not composite number')
        }
        else if(num>1){
            for(let i=2;i<num;i++){
                if(num%i==0){
                    isPrime=false;
                    break;
                }
            }
            if(isPrime)
                {
                    console.log(`${num} is a prime`);
                    
                }
        
            else{
                console.log(`${num} is not prime`);
            
        }}
        else{
            console.log('number is not prime');
            
        }
    </script>
</body>
</html>
