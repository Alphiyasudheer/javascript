<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="bootstrap-task.css">
</head>

<body>
    <div class="container">
        <div class="row">
            <div class="col-4">>
                <form action="" class="bg-light">
                    <h1 class="text-start text-primary">General information</h1>
                    <div class="row g-3">
                        <div class="col-10">
                            <select class="form-select  mb-3">
                                <option selected>Title</option>
                                <option value="1">One</option>
                                <option value="2">Two</option>
                                <option value="3">Three</option>
                            </select>
                        </div>
                    </div>
                    <div class="row mb-3">
                        <div class="col-4 ">
                            <input type="text" class="form-control border-0 border-bottom " placeholder="First Name">
                        </div>
                        <div class="col-4">
                            <input type="text" class="form-control border-0 border-bottom " placeholder="Last Name">

                        </div>
                    </div>
                    <div class="row mb-3">
                        <div class="col-10">
                            <select class="form-select" aria-label="Default select example">
                                <option selected>Position</option>
                                <option value="1">One</option>
                                <option value="2">Two</option>
                                <option value="3">Three</option>
                            </select>
                        </div>
                        <div class="row mb-3">
                            <div class="col-10">
                                <input type="text" class="form-control border-0 border-bottom" placeholder="Company">
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-4">
                                <input type="text" placeholder="Business Area"
                                    class="form-control border-0 border-bottom">
                            </div>

                            <div class="col-4">
                                <select class="form-select">
                                    <option selected>Employees</option>
                                    <option value="1">One</option>
                                    <option value="2">Two</option>
                                    <option value="3">Three</option>
                                </select>




                            </div>
                        </div>

                    </div>
            </div>

        <div class="col-4">
            <!-- <form action="" class="bg-primary"> -->
                <h1 class="text-start text-white mb-3">Contact Details</h1>
                <div class="col-10">
                    <input type="text" placeholder="Street" class="form-control border-0 border-bottom">
                </div>
        </div>
        </row>
        </form>
    </div>

</body>

</html>
